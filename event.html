<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Изменяем кириллицу на латиницу по клику</title>
  </head>

  <body>
    <h1 align="center">Изменяем кириллицу на латиницу по клику</h1>

    <ul align="center">
      <li><a href="index.html" target="_self">Решение задачи</a></li>
      <li>
        <a href="passport.html" target="_self">Считываем информацию из DOM</a>
      </li>
      <li>
        <a href="personal_data.html" target="_blank"
          >Форма отправки контактных данных</a
        >
      </li>
    </ul>

    <p>Фамилия: <span>Мазаева</span></p>
    <p>Имя: <span>Валерия</span></p>
    <p>Год рождения: <span>2002</span></p>

    <button id="change">Изменить</button>

    <script>
      document.getElementById("change").onclick = function () {
        document.getElementsByTagName("p")[0].childNodes[1].innerText =
          "Mazaeva";
        document.getElementsByTagName("p")[1].childNodes[1].innerText =
          "Valeria";
        document.getElementsByTagName("p")[2].childNodes[1].innerText = "2002";
      };
    </script>
  </body>
</html>
